services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=timesheet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev -w timesheet_backend"
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=super-secret-docker-key
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=timesheet
      - DB_SYNCHRONIZE=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    env_file:
      - ./envs/.teamwork.env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev -w admin_app -- --host 0.0.0.0"
    ports:
      - "8080:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - .:/app
    depends_on:
      - backend

  worker:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev -w worker_app -- --host 0.0.0.0"
    ports:
      - "8081:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  db_data:
